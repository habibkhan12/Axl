# Netlify deployment for AXL Books (Next.js 15 + Supabase)
# Docs: https://docs.netlify.com/integrations/frameworks/next-js/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # The Supabase project URL and anon/publishable key are meant to be public:
  # Next.js inlines NEXT_PUBLIC_* values into the bundles, so exclude them from
  # secrets scanning.
  # Real secrets (the service role key) are still scanned.
  # SECRETS_SCAN_OMIT_KEYS lists itself too, otherwise its own value (the
  # variable name above) is flagged wherever process.env references it.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,SECRETS_SCAN_OMIT_KEYS"
  # Netlify's Next runtime builds the app and wires up functions/edge —
  # it is enabled by default when netlify.toml exists; nothing else to set here.

# Dues checks are NOT automated on Netlify: functions are ephemeral and the
# live checkers (Salik, Dubai Police, Ajman Sewerage) need a desktop host with
# Chrome + ffmpeg. Here they report "manual"; the other portals are manual
# link-outs everywhere.

# All secrets (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY) are set in Site configuration → Environment
# variables — never in this file.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
